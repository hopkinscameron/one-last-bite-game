<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>One Last Bite</title>
    <meta name="description" content="Endless room-based snake. Bank your bite before the room caves in.">
    <meta name="theme-color" content="#141419">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="One Last Bite">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="TemplateData/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="TemplateData/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="TemplateData/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <img id="loading-emblem" alt="" hidden>
        <div id="loading-rank" hidden></div>
        <div id="loading-title">One Last Bite</div>
        <div id="loading-track"><div id="loading-fill"></div></div>
      </div>
      <div id="error" hidden></div>
    </div>
    <script>
      (function () {
        var canvas = document.querySelector("#unity-canvas");
        var loading = document.querySelector("#loading");
        var loadingFill = document.querySelector("#loading-fill");
        var errorBox = document.querySelector("#error");

        function showRankEmblem() {
          try {
            var emblem = localStorage.getItem("oneLastBite.rankEmblem");
            var rank = localStorage.getItem("oneLastBite.rankName");
            if (emblem && emblem.indexOf("data:image/png;base64,") === 0) {
              var image = document.querySelector("#loading-emblem");
              image.src = emblem;
              image.hidden = false;
            }

            if (rank) {
              var label = document.querySelector("#loading-rank");
              label.textContent = rank;
              label.hidden = false;
            }
          } catch (problem) {
            console.warn("Rank emblem unavailable", problem);
          }
        }

        showRankEmblem();

        function isSelectable(event) {
          return event.target instanceof Element && event.target.closest("[data-selectable]") !== null;
        }

        function preventDefault(event) {
          if (!isSelectable(event)) {
            event.preventDefault();
          }
        }

        ["gesturestart", "gesturechange", "gestureend", "contextmenu", "selectstart", "dragstart"].forEach(function (name) {
          document.addEventListener(name, preventDefault, { passive: false });
        });

        document.addEventListener("touchmove", function (event) {
          if (event.cancelable && !isSelectable(event)) {
            event.preventDefault();
          }
        }, { passive: false });

        var lastTouchEnd = 0;
        document.addEventListener("touchend", function (event) {
          var now = Date.now();
          if (now - lastTouchEnd < 350 && event.cancelable && !isSelectable(event)) {
            event.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive: false });

        function isOpaqueForeignError(event) {
          return !event.error && (!event.filename || new URL(event.filename, location.href).origin !== location.origin);
        }

        window.addEventListener("error", function (event) {
          if (isOpaqueForeignError(event)) {
            console.warn("Ignored an error from a script outside the game: " + event.message);
            event.stopImmediatePropagation();
          }
        });

        function showError(message) {
          errorBox.textContent = message;
          errorBox.hidden = false;
        }

        function showRuntimeError(message) {
          showError("Something went wrong. Reopen the game to keep playing.\n\n" + message);
          return true;
        }

        function showBanner(message, type) {
          if (type === "error") {
            showError(message);
          } else {
            console.warn(message);
          }
        }

        var buildUrl = "Build";
        var config = {
          arguments: [],
          dataUrl: buildUrl + "/941b57129af73ce8a28fa143cb15c99a.data",
          frameworkUrl: buildUrl + "/b48fa1f2e2d957404b7d5f7f50416483.framework.js",
          codeUrl: buildUrl + "/670debb619c788c8344013a3bce194f2.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "The Dragon's Lair Gaming Studio",
          productName: "One Last Bite",
          productVersion: "0.3.0",
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 3),
          showBanner: showBanner,
          errorHandler: showRuntimeError
        };

        var script = document.createElement("script");
        script.src = buildUrl + "/f1159473d95edbcf56a3fddeb5e16c28.loader.js";
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            loadingFill.style.width = (100 * progress) + "%";
          }).then(function () {
            loading.hidden = true;
            canvas.focus();
          }).catch(showError);
        };
        script.onerror = function () {
          showError("The game failed to load. Check your connection and reopen.");
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
